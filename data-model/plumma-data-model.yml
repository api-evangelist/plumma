id_prefixes: []
id_prefixes_note: >-
  No opaque object identifiers exist. The only identifiers in the model are the MSISDN, the
  server-generated X-Correlation-ID (a UUID, per-call, not addressable afterwards), and the
  numeric application id carried in x-plumma-connect-app-id.
