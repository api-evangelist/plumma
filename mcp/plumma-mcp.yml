shape_note: >-
  The mapping is unusual and worth stating. This API has ONE OpenAPI operation, so a naive
  one-tool-per-operationId derivation would produce a single tool called `connectApi` that
  takes a free-form command array — useless to an agent, which would have to know the
  vocabulary before it could pick. The command enum is the real capability surface, so the
  candidate tools below are derived one-per-COMMAND: each is the same POST /api call with
  `commands` pinned to a single value. Every tool therefore inherits its input contract
  from PlmRequest and its output from the corresponding PlmResponse block — see
  data-model/plumma-data-model.yml for the command-to-field binding.
