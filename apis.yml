name: Plumma
kind: company
description: >-
  Plumma SRL is an Italian software house in Modena (VAT IT04209450362, Via Corsini 21,
  41021 Modena; a second office in Bologna) that spent roughly 25 years building cloud-native
  SaaS for the medical-device and industrial sectors before launching its own product,
  Plumma Connect, in early 2025. Plumma Connect is an aggregation gateway in front of mobile
  network operators: it sells enterprises a single integration point for the operator-held
  identity, SIM and network-state signals that the GSMA Open Gateway programme exposes, rather
  than requiring the buyer to onboard operator-by-operator and country-by-country. Plumma is a
  GSMA Open Gateway channel partner and names GSMA, TIM, AWS and WaveMaker among its partners.
  Its architectural choice is notable and deliberate: rather than mirroring the CAMARA
  one-endpoint-per-API shape, Plumma Connect publishes a SINGLE OpenAPI 3.1 operation —
  POST /api on https://connect.plumma.it/services — that takes a phone number plus a list of
  named commands (sim_swap, kyc_match, age_verification, current_carrier, porting_logs,
  roaming_intel, churn_tracker, digital_footprint and others), so the CAMARA surface is an
  implementation detail behind an abstraction layer rather than the developer contract. The
  company positions the product for fraud prevention and identity verification — the dominant
  demand for network APIs — with stated coverage of 17 live countries across Europe, the
  Americas, APAC and Africa, and 75+ network connections. Documentation and the OpenAPI are
  public and ungated; there is no self-service sign-up, no published pricing, and no sandbox —
  onboarding is sales-led, which is the norm for this layer of the telecom value chain.
