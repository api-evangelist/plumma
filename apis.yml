name: Plumma
kind: company
description: 'Plumma SRL is an Italian software house (VAT IT04209450362, REA MO-451932) with its registered
  office at Via Corsini 21, Fellicarolo, Fanano (Modena) and an operational office at Via Provinciale
  175/B, Crespellano, Valsamoggia (Bologna). Its own product, Plumma Connect, is an aggregation gateway
  in front of mobile network operators: it sells enterprises a single integration point for the operator-held
  identity, SIM and network-state signals that the GSMA Open Gateway programme exposes, instead of requiring
  the buyer to onboard operator-by-operator and country-by-country. Plumma states it is a GSMA Open Gateway
  channel partner and names GSMA, TIM, AWS and WaveMaker among its partners.


  Its architectural position is the notable part, and it is deliberate. Rather than mirroring the CAMARA
  one-endpoint-per-capability shape, Plumma Connect publishes a SINGLE OpenAPI 3.1 operation — POST /api
  on https://connect.plumma.it/services — that takes a phone number in E.164 form plus a list of named
  commands (sim_swap, kyc_match, age_verification, current_carrier, porting_logs, roaming_intel, churn_tracker,
  digital_footprint and others), so the CAMARA surface is an implementation detail behind an abstraction
  layer rather than the developer contract. The company is not, however, standard-averse underneath: its
  KYC request schema carries the CAMARA KnowYourCustomer Match attribute vocabulary verbatim (in snake_case),
  and every 4xx/5xx returns an RFC 7807 problem document with a correlation_id. The divergence is at the
  endpoint shape, not the data model.


  The product is positioned for fraud prevention and identity verification, with company-stated coverage
  of 17 live countries across Europe, the Americas, APAC and Africa and 75+ network connections. Documentation,
  the OpenAPI and a draft-07 request schema are public and ungated, and the JavaScript documentation portal
  is backed by an unauthenticated JSON content API at connect.ploomma.com that serves 72 documents including
  the billing guide, SLA, terms and full command reference. Billing is EUR 200/month plus a prepaid wallet
  charged per served command; published rate limits are 2/5 RPS and 180 commands/day. There is no MCP
  server, no agent card, no SDKs and no /.well-known documents — the provider marks SDKs and webhooks
  ''under construction''.'
