name: Plumma Connect command vocabulary
summary: >-
  On this API the controlled vocabulary IS the interface. There are no resource paths to
  name; a caller sends a `commands` array and every capability, every billing unit and
  every error ordinal is keyed on one of these strings. This file is the authoritative
  cross-reference of the three places Plumma publishes that vocabulary — the OpenAPI enum,
  the Commands documentation, and the cmd_enc ordinal table — because the three do not
  agree.
authoritative_source: '#/components/schemas/allowedCommandValues in the OpenAPI'
groups:
- name: Number & network intelligence
  terms:
