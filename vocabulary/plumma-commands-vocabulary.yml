coverage_classes:
  global:
    definition: >-
      Served and billed for EVERY country regardless of the number's origin. The
      no-coverage billing exemption does not apply to them.
    terms: [current_carrier, line_classification, issuing_carrier, digital_footprint, roaming_intel]
  country_specific:
    definition: >-
      Routed only where a supplier is configured for the resolved country. Uncovered calls
      return status 2 or contribute to a status 4 partial reply, and are not billed.
    terms: all others
divergences:
- id: enum-vs-docs
  detail: >-
    The OpenAPI enum accepts 17 command strings. The Commands documentation and the cmd_enc
    ordinal table between them name at least 23 (adding enhanced_type, qdr_history,
    number_verification, scam_check, address_cleanse, device_swap, device_location). The
    public product page counts 19. A client generated from the contract cannot send the
    six that are documented but not enumerated.
- id: ordinals-are-a-second-registry
  detail: >-
    cmd_enc assigns fixed 0-19 ordinals, which is effectively a second, longer registry of
    the same vocabulary. Three of its ordinals (17 qdr_history, 18 number_verification,
    19 scam_check) have no counterpart in the request enum, so the error encoding can
    describe outcomes for commands the contract will not accept.
- id: naming-style
  detail: >-
    Commands are snake_case; the response block for sim_swap is `simswap` (no underscore)
    and for commercial_segment is `market_segment` (a different word). The command name is
    therefore not a reliable key for the response field — see
    data-model/plumma-data-model.yml for the full binding.
